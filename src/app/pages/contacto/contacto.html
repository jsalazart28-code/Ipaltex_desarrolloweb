<section class="section contact"><small class="eyebrow">CONVERSEMOS</small><h1>Contacto</h1><p>Formulario demostrativo. No envía mensajes reales.</p><form (ngSubmit)="send()" #f="ngForm"><label>Nombre<input name="name" required [(ngModel)]="contact.name"></label><label>Correo<input name="email" type="email" required email [(ngModel)]="contact.email"></label><label>Mensaje<textarea name="message" required [(ngModel)]="contact.message"></textarea></label><button class="btn" [disabled]="f.invalid">Enviar consulta de prueba</button></form>@if(sent){<p role="status">Consulta simulada correctamente. No se envió ningún mensaje.</p>}</section>
