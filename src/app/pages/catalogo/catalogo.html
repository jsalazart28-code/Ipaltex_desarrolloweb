<section class="page-title"><small class="eyebrow">COLECCIÓN TEXTIL</small><h1>Catálogo de telas</h1><p>Encuentra el material adecuado para tu próximo proyecto.</p></section><section class="section catalog"><aside class="filters"><h3>Filtros</h3><label>Buscar<input [(ngModel)]="search" placeholder="Nombre o código"></label><label>Categoría<select [(ngModel)]="category"><option value="">Todas</option>@for(c of data.categories;track c){<option>{{c}}</option>}</select></label><label>Color<select [(ngModel)]="color"><option value="">Todos</option>@for(c of colors;track c){<option>{{c}}</option>}</select></label><label>Precio máximo (S/)<input type="number" min="0" [(ngModel)]="maxPrice"></label><button class="btn secondary" (click)="reset()">Limpiar filtros</button></aside><div><p>{{filtered.length}} productos encontrados</p><div class="product-grid catalog-grid">@for(p of filtered;track p.id){<app-product-card [product]="p"/>}@empty{<p>No encontramos productos con esos filtros.</p>}</div></div></section>
